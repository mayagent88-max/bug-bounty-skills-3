  needs_review: false
  rationale: A draft given before a noncontested daily window opened led to an action before the window opened that the checker rejected as already drawn, and only a fresh action after the window opened entered the current period. The user then corrected the concept repeatedly, stating early standby belongs only to contested slots such as a contested mint or a new contested waitlist, while a noncontested entry must be given at its opening time. The same task also spun while searching for a submit control on an unconnected page, until the wallet connection and account display came first. This new skill is scoped to entry timing and connect before submit, which the existing timed mint connect skill does not cover, and that existing skill stays untouched inside its measurement window. The skill is written generically with no project, account or wallet detail, so it applies to future timed windows rather than repeating one conversation.
