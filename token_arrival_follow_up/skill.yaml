  rationale: 'The $CREDIT follow up was scheduled as a single runonce check at 03:05 WIB on 1 Nov 2026 (scheduler_job:credit-launch-sell-check, run 817c255c-ade7-41b7-9176-d9016bc98960), which found no token and no published contract. The token actually arrived at 03:38 WIB, 33 minutes later, and the user then asked why it had not been sold (message:df76346b-9115-48ac-8bec-42bcb5754ac2); the assistant admitted the 03:05 check was single-use with no follow up scheduled. A reusable polling method, rather than a one-off cron fix, addresses the mechanism: a negative check must stay pending until arrival, deadline, or cancellation. This proposal does not duplicate the existing dex-aggregator skill, which already covers multi-router liquidity wording and was verified at ~/workspace/custom-skills/dex-aggregator/SKILL.md but is not loop-managed (no skill_improvement.managed flag), so it is left untouched. The deterministic handoff-suppression candidates were rejected because recurring, validation, and replay failures were all zero, so suppression there reads as healthy idle behaviour, not a failure to fix.'
