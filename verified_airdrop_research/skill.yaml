  rationale: 'The window''s core airdrop work shows one repeated mechanism: a first-pass recommendation that omits a gate or follow-on task, corrected later. Action Model was first presented as install the extension, then corrected to require an Ethos Score of 1300+ first (message:assistant-msg-8490cd8d-d874-415e-b413-6cd4ff89c1fb then message:assistant-msg-928be9c7-502e-d465-4b8d-dad0d9c8781a). Sovren was first presented as connect, follow and claim, then corrected to add five post-claim tasks before the freeze (message:assistant-msg-22511222-a91a-37a7-8394-a3cc2b5d32b6 then message:assistant-msg-f3940156-55a5-cf81-95e9-7020fd58f3a1). Canopy was first presented with the false claim the user never registered, corrected by the user saying he farmed it and got nothing (message:eb5ef169-44e6-4334-92cc-79da7b6f4ff2). A reusable checklist that forces the full gate list, the post-first-action tasks, the domain and cost check, and a memory check on participation before recommending directly targets that mechanism. The deterministic handoff-suppression candidates were rejected because they concern objective-loop trigger policy, which this loop cannot publish as a skill or connector doc, and the memory recurring-failure rollup carried no failure detail to ground a change.'
